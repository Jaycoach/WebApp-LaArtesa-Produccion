server {
    listen 80;
    server_name 54.196.194.114;

    root /var/www/artesa-frontend/dist;
    index index.html;

    # SPA fallback — React Router maneja las rutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca debe ser cacheado por el browser
    # (cada deploy genera un nuevo hash en los assets; el browser necesita
    #  descargar el HTML para descubrir los nuevos nombres de archivos)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Archivos estáticos con hash en el nombre (Vite): cache agresivo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Alias para clientes que llaman /api/health en vez de /health
    location = /api/health {
        proxy_pass http://localhost:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Health check del backend (ruta raíz, fuera de /api)
    location = /health {
        proxy_pass http://localhost:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Proxy al backend Node.js
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeouts extendidos para operaciones largas (ej: sincronización BOM ~75s)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
