# ============================================================
# NGINX — La Artesa Producción
# ============================================================
# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/artesa-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/artesa-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de seguridad ─────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Frontend React (archivos estáticos) ──────────────────
    root /var/www/artesa-frontend/dist;
    index index.html;

    # SPA fallback — React Router maneja las rutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca debe ser cacheado por el browser
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Archivos estáticos con hash en el nombre (Vite): cache agresivo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API Backend → proxy a Node.js puerto 3000 ────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts extendidos para operaciones largas (ej: sincronización BOM ~75s)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Health check ─────────────────────────────────────────
    # Ruta directa /health
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # Alias /api/health → /health del backend
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # ── Swagger solo acceso interno ──────────────────────────
    location /api-docs {
        proxy_pass http://127.0.0.1:3000;
        allow 127.0.0.1;
        deny all;
    }

    # ── Negar archivos ocultos (.env, .git, etc.) ────────────
    location ~ /\. {
        deny all;
    }
}
