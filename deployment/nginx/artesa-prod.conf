server {
    listen 80;
    listen [::]:80;
    server_name produccion.artesapanaderia.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name produccion.artesapanaderia.com;

    ssl_certificate     /etc/letsencrypt/live/produccion.artesapanaderia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/produccion.artesapanaderia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              SAMEORIGIN always;
    add_header X-Content-Type-Options       nosniff always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;

    root  /var/www/artesa-frontend/dist;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout    1200s;
        proxy_read_timeout    1200s;
    }

    location = /health    { proxy_pass http://127.0.0.1:3000/health; allow 127.0.0.1; deny all; access_log off; }
    location = /api/health { proxy_pass http://127.0.0.1:3000/health; allow 127.0.0.1; deny all; access_log off; }
    location /api-docs     { proxy_pass http://127.0.0.1:3000; allow 127.0.0.1; deny all; }

    # Anti-bot (capturado de staging 2026-05-26)
    deny 88.80.187.35;
    location ~* \.(bak|swp|old|sql|tar|gz|zip|env|cfg|pem|key|rb|py|sh|php)$ { return 444; }
    location ~* ^/api/(admin|backup|credentials|debug|composer|wp-admin|phpmyadmin) { return 444; }
    location ~ /\. { return 444; }
}
